name: Deploy Wazee wa Betting TZ

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build production bundle
        run: pnpm run build
      - name: Create static Pages entrypoint from SSR HTML
        shell: bash
        run: |
          set -euo pipefail
          css_file=$(find .output/public/assets -maxdepth 1 -name 'styles-*.css' -printf '%f\n' | head -1)
          test -n "$css_file"
          pnpm run dev --host 127.0.0.1 --port 4174 >/tmp/wazee-pages-vite.log 2>&1 &
          vite_pid=$!
          trap 'kill "$vite_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4174/wazee-wa-betting-tz/ >/tmp/wazee-ssr.html; then break; fi
            sleep 1
          done
          test -s /tmp/wazee-ssr.html
          CSS_FILE="$css_file" python3 - <<'PY'
          import os, re
          from pathlib import Path
          html = Path('/tmp/wazee-ssr.html').read_text()
          html = re.sub(r'<link[^>]+(?:/src/styles\.css|/@tanstack-start/styles\.css|/@id/virtual:tanstack-start-dev-client-entry)[^>]*>', '', html)
          html = re.sub(r'<script[^>]+/@id/virtual:tanstack-start-dev-client-entry[^>]*>\s*</script>', '', html)
          css = os.environ['CSS_FILE']
          html = html.replace('</head>', f'<base href="/wazee-wa-betting-tz/" /><link rel="stylesheet" href="/wazee-wa-betting-tz/assets/{css}" /></head>')
          html = re.sub(r'<script[^>]+type="module"[^>]*>\s*</script>', '', html)
          Path('.output/public/index.html').write_text(html)
          PY
          cp .output/public/index.html .output/public/404.html
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
