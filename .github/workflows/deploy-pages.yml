name: Deploy Wazee wa Betting TZ

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build production bundle
        run: pnpm run build
      - name: Create static Pages entrypoint from SSR HTML
        shell: bash
        run: |
          set -euo pipefail
          css_file=$(find .output/public/assets -maxdepth 1 -name 'styles-*.css' -printf '%f\n' | head -1)
          test -n "$css_file"
          pnpm run dev --host 127.0.0.1 --port 4174 >/tmp/wazee-pages-vite.log 2>&1 &
          vite_pid=$!
          trap 'kill "$vite_pid" 2>/dev/null || true' EXIT
          CSS_FILE="$css_file" python3 - <<'PY'
          import os, re
          from pathlib import Path
          import subprocess

          base = '/wazee-wa-betting-tz'
          routes = ['', 'login', 'register', 'community', 'matches', 'leaderboard', 'create-ticket', 'dashboard', 'admin']
          css = os.environ['CSS_FILE']

          def render(route):
              url = f'http://127.0.0.1:4174{base}/{route}'.rstrip('/') + ('/' if not route else '')
              for _ in range(30):
                  result = subprocess.run(['curl', '-fsS', url], capture_output=True, text=True)
                  if result.returncode == 0 and result.stdout.strip():
                      return result.stdout
                  subprocess.run(['sleep', '1'], check=True)
              raise SystemExit(f'Could not render {url}')

          def prepare(html):
              html = re.sub(r'<link[^>]+(?:/src/styles\.css|/@tanstack-start/styles\.css|/@id/virtual:tanstack-start-dev-client-entry)[^>]*>', '', html)
              html = re.sub(r'<script[^>]+/@id/virtual:tanstack-start-dev-client-entry[^>]*>\s*</script>', '', html)
              html = html.replace('</head>', f'<base href="{base}/" /><link rel="stylesheet" href="{base}/assets/{css}" /></head>')
              return re.sub(r'<script[^>]+type="module"[^>]*>\s*</script>', '', html)

          for route in routes:
              html = prepare(render(route))
              target = Path('.output/public') / route / 'index.html' if route else Path('.output/public/index.html')
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(html)

          # Keep a root fallback for unknown/dynamic routes while preserving route-specific pages above.
          Path('.output/public/404.html').write_text(Path('.output/public/index.html').read_text())
          PY
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
