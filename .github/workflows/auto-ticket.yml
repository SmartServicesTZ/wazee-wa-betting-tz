name: Generate automatic ticket (GitHub Actions)
# Standalone Admin SDK job: it does not deploy or invoke Firebase Cloud Functions.

on:
  workflow_dispatch:
  schedule:
    # Four runs/day, away from the top of the hour, to stay within the free Sports API quota.
    - cron: "17 0,6,12,18 * * *"

permissions:
  contents: read

concurrency:
  group: auto-ticket
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test Auto Ticket odds policy
        run: node --test functions/scripts/auto-ticket-policy.test.mjs
      - name: Install standalone runner dependencies
        working-directory: functions/scripts
        run: npm ci --ignore-scripts
      - name: Sync sports data and publish automatic ticket
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT || secrets.FIREBASE_SERVICES_ACCOUNT }}
          SPORTS_API_KEY: ${{ secrets.SPORTS_API_KEY }}
          SPORTS_API_BASE_URL: ${{ secrets.SPORTS_API_BASE_URL }}
          MAX_ODDS_FIXTURES: "3"
        run: node functions/scripts/auto-ticket.mjs
