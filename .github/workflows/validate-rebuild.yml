name: Validate rebuild
on:
  push:
    branches: ["rebuild/**"]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Test automatic ticket target selection
        run: node --test functions/scripts/*.test.mjs
      - run: node --check functions/scripts/auto-ticket.mjs
      - run: node --check functions/scripts/live-sync.mjs
      - run: pnpm exec prettier --write "src/**/*.{ts,tsx,css}"
      - run: pnpm run build
      - name: Build Firebase Functions
        working-directory: functions
        run: npm install && npm run build
